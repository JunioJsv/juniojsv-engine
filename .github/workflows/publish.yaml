name: Publish
on:
  workflow_dispatch:
  release:
    types: [released]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Release build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Change Gradle wrapper permissions
        run: chmod +x ./gradlew

      - name: Publish to GitHub Packages (All Platforms)
        run: ./gradlew publish -PdesktopNatives=all
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Example Binaries (All Platforms)
        run: ./gradlew :example-jvm:distZip :example-android:assembleDebug -PdesktopNatives=all

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: |
            example-jvm/build/distributions/*.zip
            example-android/build/outputs/apk/debug/*.apk

      - name: Attach Binaries to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            example-jvm/build/distributions/*.zip
            example-android/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}